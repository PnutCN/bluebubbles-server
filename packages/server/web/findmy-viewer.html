<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<title>Find My</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Find My","display":"standalone","start_url":".","background_color":"%230b0f14","theme_color":"%230b0f14"}'>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.4 -apple-system, "SF Pro Text", Roboto, sans-serif; background: #f5f5f7; color: #111; }
  @media (prefers-color-scheme: dark) { body { background: #0b0f14; color: #eee; } }
  #map { width: 100%; height: 46vh; min-height: 260px; }
  #list { padding: 8px 12px 24px; max-width: 640px; margin: 0 auto; }
  .friend { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-bottom: 1px solid rgba(128,128,128,.25); cursor: pointer; }
  .friend img, .initials { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; flex: none; }
  .initials { display: flex; align-items: center; justify-content: center; font-weight: 600; color: #fff; background: linear-gradient(135deg, #8e8e93, #636366); }
  .friend .meta { min-width: 0; flex: 1; }
  .friend .name { font-weight: 600; }
  .friend .addr { opacity: .75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .friend .time { font-size: 12px; opacity: .55; }
  .live { width: 9px; height: 9px; border-radius: 50%; background: #30d158; display: inline-block; margin-right: 5px; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; max-width: 640px; margin: 0 auto; }
  header h1 { font-size: 18px; margin: 0; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 7px 14px; background: #0a84ff; color: #fff; cursor: pointer; }
  button:disabled { opacity: .5; }
  #setup { max-width: 400px; margin: 15vh auto 0; padding: 0 20px; display: none; }
  #setup input { width: 100%; padding: 10px; margin: 6px 0; border-radius: 8px; border: 1px solid rgba(128,128,128,.4); font: inherit; background: transparent; color: inherit; }
  #empty { text-align: center; opacity: .6; padding: 30px; display: none; }
  .marker-img { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #fff; object-fit: cover; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
  .marker-initials { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #fff; background: linear-gradient(135deg, #8e8e93, #636366); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; box-shadow: 0 1px 4px rgba(0,0,0,.4); }
</style>
</head>
<body>
<header>
  <h1>Find My</h1>
  <div>
    <button id="refreshBtn">Refresh</button>
    <button id="configBtn" style="background:transparent;color:#0a84ff">&#9881;</button>
  </div>
</header>
<div id="map"></div>
<div id="list"></div>
<div id="empty">No friends sharing locations.</div>
<div id="setup">
  <h2>Connect to your server</h2>
  <input id="inUrl" placeholder="Server URL">
  <input id="inGuid" type="password" placeholder="Server password">
  <button id="saveBtn" style="width:100%">Save &amp; connect</button>
  <p style="opacity:.6;font-size:13px">Served by your BlueBubbles server; locations come from its Find My cache. Address lookup uses OpenStreetMap Nominatim from this device.</p>
</div>
<script>
"use strict";
const $ = id => document.getElementById(id);
const store = {
  get url() { return localStorage.getItem("bb_url") || location.origin; },
  set url(v) { localStorage.setItem("bb_url", v.replace(/\/+$/, "")); },
  get guid() { return localStorage.getItem("bb_guid") || ""; },
  set guid(v) { localStorage.setItem("bb_guid", v); }
};

let map, markers = {};
function initMap() {
  map = L.map("map", { attributionControl: true }).setView([39.5, -98.35], 4);
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap" }).addTo(map);
}

function api(path, method) {
  return fetch(store.url + "/api/v1/icloud/findmy/" + path + "?guid=" + encodeURIComponent(store.guid), { method: method || "GET" })
    .then(r => { if (r.status === 401 || r.status === 403) throw new Error("auth"); if (!r.ok) throw new Error("http " + r.status); return r.json(); });
}

const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const initialsOf = name => (name || "?").split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();
const ago = ms => { const m = Math.max(0, Math.round((Date.now() - ms) / 60000)); return m < 1 ? "just now" : m < 60 ? m + "m ago" : Math.floor(m / 60) + "h " + (m % 60) + "m ago"; };

// Reverse geocode via Nominatim, cached forever per ~100m cell (friends update the
// cell when they move; the cache key changes with them).
const geoCache = JSON.parse(localStorage.getItem("geo_cache") || "{}");
let geoQueue = Promise.resolve();
function addressFor(lat, lng) {
  const cell = lat.toFixed(3) + "," + lng.toFixed(3);
  if (geoCache[cell] !== undefined) return Promise.resolve(geoCache[cell]);
  geoQueue = geoQueue.then(() => new Promise(res => setTimeout(res, 1100))).then(() =>
    fetch("https://nominatim.openstreetmap.org/reverse?format=jsonv2&lat=" + lat + "&lon=" + lng)
      .then(r => r.json())
      .then(d => {
        const a = d.address || {};
        const street = [a.house_number, a.road].filter(Boolean).join(" ");
        const cityState = [a.city || a.town || a.village || a.suburb, a.state_code || a.state].filter(Boolean).join(", ");
        const label = street ? (cityState ? street + ", " + cityState : street) : (cityState || d.display_name || "");
        geoCache[cell] = label;
        localStorage.setItem("geo_cache", JSON.stringify(geoCache));
        return label;
      })
      .catch(() => { geoCache[cell] = ""; return ""; })
  );
  return geoQueue;
}

function avatarHtml(f, cls) {
  return f.avatar
    ? '<img class="' + cls + '" src="data:image/jpeg;base64,' + f.avatar + '" alt="">'
    : '<div class="' + (cls === "marker-img" ? "marker-initials" : "initials") + '">' + esc(initialsOf(f.title || f.handle)) + "</div>";
}

async function load(doRefresh) {
  $("refreshBtn").disabled = true;
  try {
    const res = doRefresh ? await api("friends/refresh", "POST") : await api("friends", "GET");
    render(res.data || []);
  } catch (e) {
    if (e.message === "auth") showSetup();
  } finally {
    $("refreshBtn").disabled = false;
  }
}

async function render(friends) {
  $("empty").style.display = friends.length ? "none" : "block";
  const list = $("list");
  list.innerHTML = "";
  const bounds = [];
  const seen = new Set();

  for (const f of friends) {
    const id = f.handle || f.title || JSON.stringify(f.coordinates);
    seen.add(id);
    const [lat, lng] = f.coordinates || [0, 0];
    const hasLoc = lat !== 0 || lng !== 0;
    const name = f.title || f.handle || "Unknown";
    const cell = hasLoc ? { lat, lng } : null;

    const item = document.createElement("div");
    item.className = "friend";
    item.innerHTML = avatarHtml(f, "") +
      '<div class="meta"><div class="name">' + (f.status === "live" ? '<span class="live"></span>' : "") + esc(name) +
      '</div><div class="addr" data-addr>…</div><div class="time">' + (f.last_updated ? ago(f.last_updated) : "") + "</div></div>";
    if (cell) item.onclick = () => { map.setView([lat, lng], 15); markers[id] && markers[id].openPopup(); };
    list.appendChild(item);

    const addrEl = item.querySelector("[data-addr]");
    if (hasLoc) {
      addressFor(lat, lng).then(a => { addrEl.textContent = a || lat.toFixed(4) + ", " + lng.toFixed(4); });
      bounds.push([lat, lng]);
      const icon = L.divIcon({ className: "", iconSize: [42, 42], iconAnchor: [21, 21],
        html: f.avatar ? '<img class="marker-img" src="data:image/jpeg;base64,' + f.avatar + '">' : '<div class="marker-initials">' + esc(initialsOf(name)) + "</div>" });
      if (!markers[id]) markers[id] = L.marker([lat, lng], { icon });
      else { markers[id].setLatLng([lat, lng]); markers[id].setIcon(icon); }
      if (!map.hasLayer(markers[id])) markers[id].addTo(map);
      markers[id].bindPopup("<b>" + esc(name) + "</b><br><span data-popup-addr>" + esc(addrEl.textContent) + "</span>");
      addressFor(lat, lng).then(a => { const m = markers[id] && markers[id].getPopup(); if (m) m.setContent("<b>" + esc(name) + "</b><br>" + esc(a || lat.toFixed(4) + ", " + lng.toFixed(4)) + (f.last_updated ? "<br><small>" + ago(f.last_updated) + "</small>" : "")); });
    } else {
      addrEl.textContent = "No location";
      if (markers[id]) { map.removeLayer(markers[id]); delete markers[id]; }
    }
  }

  for (const id of Object.keys(markers)) {
    if (!seen.has(id)) { map.removeLayer(markers[id]); delete markers[id]; }
  }
  if (bounds.length && !render.didFit) { map.fitBounds(bounds, { padding: [40, 40] }); render.didFit = true; }
}

function showSetup() {
  $("setup").style.display = "block";
  $("map").style.display = "none";
  $("list").style.display = "none";
  $("inUrl").value = store.url;
}

$("saveBtn").onclick = () => {
  store.url = $("inUrl").value.trim();
  store.guid = $("inGuid").value.trim();
  location.reload();
};
$("configBtn").onclick = showSetup;
$("refreshBtn").onclick = () => load(true);

if (!store.guid) showSetup();
else { initMap(); load(false); setInterval(() => load(true), 60000); }
</script>
</body>
</html>
